name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    name: Lint & validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Valider les fichiers JSON de traduction
        id: json
        run: |
          fail=0
          for f in translations/*.json; do
            if ! python3 -m json.tool "$f" > /dev/null 2>&1; then
              echo "::error file=$f::JSON invalide"
              fail=1
            fi
          done
          exit $fail

      - name: Verifier la syntaxe des scripts Python
        id: python
        if: always()
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if ! python3 -m py_compile "$f" 2>&1; then
              echo "::error file=$f::Erreur de syntaxe Python"
              fail=1
            fi
          done < <(find scripts -name "*.py" -print0)
          exit $fail

      - name: ShellCheck sur les scripts shell
        id: shellcheck
        if: always()
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          severity: warning

      - name: Installer qmlformat
        if: always()
        run: sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools

      - name: Verifier le formatage QML
        id: qmlformat
        if: always()
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if ! qmlformat --verify --config-file .qmlformat.ini "$f" 2>&1; then
              echo "::error file=$f::Formatage QML incorrect"
              fail=1
            fi
          done < <(find . -name "*.qml" -not -path "./assets/*" -print0)
          exit $fail

      - name: Ecrire le log de statut
        if: always()
        run: |
          {
            echo "# CI Status"
            echo ""
            echo "Commit: ${{ github.sha }}"
            echo "Branche: ${{ github.ref_name }}"
            echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "| Etape | Resultat |"
            echo "|---|---|"
            echo "| JSON traductions | ${{ steps.json.outcome }} |"
            echo "| Syntaxe Python | ${{ steps.python.outcome }} |"
            echo "| ShellCheck | ${{ steps.shellcheck.outcome }} |"
            echo "| Formatage QML | ${{ steps.qmlformat.outcome }} |"
          } > ci-status.md

      - name: Commit et push le log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci-status.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: mise a jour ci-status.md [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

